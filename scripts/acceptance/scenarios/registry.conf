# Scenario registry — scripts/acceptance/scenarios/registry.conf (AT-11 slice 1)
#
# Format (tab-separated):
#   id <TAB> activates_at_milestone <TAB> file <TAB> level <TAB> description
#
# A scenario is ACTIVATED only when its file exists under this directory
# (authored) AND the current milestone >= activates_at_milestone. A registry
# row whose file is missing reports NOT-YET-ACTIVATED with reason "not
# authored" — never a skip, never green (design Decision 3; Engram
# sdd/at-11-instalable/v2-gate). Scenario files are added by tasks 1.3, 1.8,
# 2.6, 3.5, and 4.2; this skeleton ships with task 1.1, zero authored.
#
# Validator note A (task 1.4 decision, recorded here so it is never implicit):
# the README's local-repository installation route (`git clone` +
# `herdr plugin link`) is DOCS-COVERED-ONLY. It carries no id= block and no
# dedicated scenario: its coverage is the documented steps themselves plus
# the plugin smoke suite's linked-checkout scenarios. The harness-executable
# routes are exactly the id=-tagged blocks (install-plugin-github,
# install-plugin-curl) consumed by scenarios 1 and 2.
plugin-fresh-clone	1	01-plugin-fresh-clone.sh	V2	Install the plugin from a fresh clone following the documented steps
plugin-subdir-install	1	02-plugin-subdir-install.sh	V2	Install the plugin via the herdr subdirectory route (OQ-1 probe)
zero-machine-paths	2	03-zero-machine-paths.sh	V1+V2	No machine-specific paths leak from a clean install
first-run-keys	3	04-first-run-keys.sh	V2	First run captures credentials without argv exposure
stt-consent-download	3	05-stt-consent-download.sh	V2	STT model downloads only with explicit consent
stt-refusal-degrades	3	06-stt-refusal-degrades.sh	V2	STT refusal degrades gracefully without breaking onboarding
reinstall-idempotent	2	07-reinstall-idempotent.sh	V2	Re-running the installer preserves user state
doctor-diagnoses-break	4	08-doctor-diagnoses-break.sh	V2	Doctor names the exact repair for a simulated breakage
post-wizard-health	4	09-post-wizard-health.sh	V2+V3	Post-wizard automated health checks (timed UAT half stays V3)
