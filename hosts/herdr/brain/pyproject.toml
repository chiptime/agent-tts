[project]
name = "herdr-brain"
version = "0.1.0"
description = "Conversational brain service that talks to AI coding agents managed by Herdr."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bruno Silva" }]
dependencies = [
    "faster-whisper>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "coverage>=7.6,<8", "pytest-playwright>=0.5,<0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
