name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-bash-tests:
    name: TTS Plugin / Ubuntu (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run sandboxed Bash harnesses
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash hosts/herdr/tts-plugin/tests/all_bash_harnesses.sh

  engine-tests:
    name: Engine / ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install engine package with dev extras
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Use a short temp dir on macOS
        # macOS's default TMPDIR (/private/var/folders/...) makes pytest's
        # tmp_path sockets exceed the 104-byte AF_UNIX path limit.
        if: runner.os == 'macOS'
        run: echo "TMPDIR=/tmp" >> "$GITHUB_ENV"

      - name: Run boundary tests (RF-AT-10-5)
        run: python -m pytest engine/tests/test_monorepo_boundaries.py -q

      - name: Run engine test suite
        working-directory: engine
        # Windows and macOS are not yet proven green on hosted runners;
        # they report without blocking until a first green run lands.
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
        run: python -m pytest tests/ -q

  engine-lint:
    name: Engine / Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine package with dev extras
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff check (correctness rules from pyproject.toml)
        working-directory: engine
        run: ruff check src/ tests/

  brain-tests:
    name: Herdr Brain / Ubuntu (py3.12, node20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install brain dependencies
        working-directory: hosts/herdr/brain
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          # The fallback E2E drives the REAL engine (only providers are faked).
          pip install -e ../../../engine

      - name: Install Chromium for the browser E2E suite
        working-directory: hosts/herdr/brain
        run: python -m playwright install --with-deps chromium

      - name: Run brain JS tests
        working-directory: hosts/herdr/brain
        run: node --test tests/js/

      # Three separate processes: the Playwright suites (browser, e2e) start
      # their own event loop and servers, and sharing one pytest process
      # with the API tests makes both sides fail in ways neither does alone.
      - name: Run brain Python tests
        working-directory: hosts/herdr/brain
        run: python -m pytest tests/ -q --ignore=tests/browser --ignore=tests/e2e

      - name: Run brain browser tests
        working-directory: hosts/herdr/brain
        run: python -m pytest tests/browser -q

      - name: Run brain end-to-end tests
        working-directory: hosts/herdr/brain
        run: python -m pytest tests/e2e -q
