name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run test suite
        # Windows is experimental signal for now: the suite was written on
        # Linux and audio-device/WSL-specific tests are expected to skew
        # results there. continue-on-error keeps the gate green while the
        # Windows parity work (README roadmap item) collects evidence.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: python -m pytest tests/ -q
