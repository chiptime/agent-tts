[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tts"
version = "0.1.0"
description = "Lightweight, cross-platform neural TTS engine with interactive IPC seek/pause controls for AI coding agents & terminal workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "ChipTime (Bruno Silva)", email = "brunosilva.narro@gmail.com" }
]
keywords = ["tts", "agent", "neural-tts", "miniaudio", "edge-tts", "openai-tts", "elevenlabs", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "edge-tts>=6.1.19",
    "miniaudio>=1.59",
]

[project.optional-dependencies]
# Optional extras: the default install (edge/openai/elevenlabs/piper) needs
# none of these. numpy is not listed here on purpose: it arrives with
# onnxruntime and is already pulled in transitively by miniaudio.
kokoro = [
    "onnxruntime>=1.16",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-tts = "agent_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
